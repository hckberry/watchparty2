<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch Party</title>
<style>
:root{
  --bg:#0f0f11; --panel:#17171a; --panel2:#202024; --line:#2a2a30; --text:#ededf0; --mute:#8f8f99;
  --accent:#e8553d; --ok:#4ccf8a;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;letter-spacing:-.2px}
.logo b{color:var(--accent)}
.info{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:13px;color:var(--mute);padding:4px 10px;border:1px solid var(--line);border-radius:6px}
.tag.code{color:var(--text);font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums}
.tag.live{color:var(--ok);border-color:#244a38}

.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:#2a2a30}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#f0634b}
.btn.sm{padding:5px 10px;font-size:13px}
input[type=text],input:not([type]),select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none}
input:focus,select:focus{border-color:#55555f}
label.f{display:block;font-size:13px;color:var(--mute);margin:14px 0 5px}

/* lobby */
#lobby{max-width:400px;margin:9vh auto 0;padding:0 18px}
#lobby h1{font-size:28px;margin:0 0 6px;letter-spacing:-.4px}
#lobby .lead{color:var(--mute);margin:0 0 22px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 20px 20px}
.mode{display:flex;border-bottom:1px solid var(--line);margin:0 -20px 4px}
.mode button{flex:1;background:none;border:0;padding:14px;color:var(--mute);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.mode button.on{color:var(--text);border-bottom-color:var(--accent)}
.box .btn.primary{width:100%;margin-top:18px;padding:11px}
#joinCode{text-transform:uppercase;letter-spacing:4px;font-weight:700}

/* room */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px 20px 30px;max-width:1500px;margin:0 auto;align-items:start}
.stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);gap:4px;text-align:center;padding:16px}
.empty strong{color:var(--text);font-size:17px}
.now{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 2px;font-size:14px;color:var(--mute)}
.now b{color:var(--text);font-size:16px}

.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;height:min(calc(100vh - 100px),760px);min-height:460px;overflow:hidden;position:sticky;top:12px}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
.tab{flex:1;background:none;border:0;padding:12px;color:var(--mute);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto;padding:12px}
.search{display:flex;gap:6px}
.kind{display:flex;gap:6px;margin:10px 0 0}
.chip{flex:1;text-align:center;padding:6px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer;background:none}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.opts{display:flex;align-items:center;gap:8px;margin:10px 0 12px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.opts select{width:auto;padding:5px 8px;font-size:13px}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.subdub{display:flex;gap:4px;margin:8px 0}
.sdbtn{flex:1;padding:6px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--mute);font-weight:600;font-size:12px;cursor:pointer}
.sdbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer}
.card .img{aspect-ratio:2/3;background:var(--panel2) center/cover;border-radius:6px;border:1px solid var(--line);transition:border-color .15s}
.card:hover .img{border-color:var(--accent)}
.card .t{font-size:12.5px;font-weight:600;margin-top:5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .y{font-size:12px;color:var(--mute)}
.msgline{color:var(--mute);font-size:14px;padding:22px 6px;text-align:center}
.back{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back h3{margin:0;font-size:16px;flex:1;line-height:1.25}
.ep{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer}
.ep:hover{background:var(--panel2)}
.ep .n{width:26px;color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
.ep .tt{flex:1;font-size:14px;line-height:1.3}
.ep small{display:block;color:var(--mute);font-size:12px}

.chatlog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.msg{font-size:14px;overflow-wrap:anywhere}
.msg b{color:var(--accent);margin-right:6px}
.msg.sys{color:var(--mute);font-size:13px}
.chatsend{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;transition:.2s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .layout{grid-template-columns:1fr;padding:12px}
  .side{position:static;height:480px;min-height:0}
}
@media (max-width:520px){header{padding:10px 12px}.stage{border-radius:8px}}
</style>
</head>
<body>
<header>
  <div class="logo">Watch<b>Party</b></div>
  <div class="info" id="roomInfo" hidden>
    <span class="tag code" id="codePill">------</span>
    <button class="btn sm" id="copyBtn">Copy code</button>
    <button class="btn sm" id="linkBtn">Invite link</button>
    <span class="tag" id="rolePill">Host</span>
    <span class="tag" id="statusPill">Connecting…</span>
    <button class="btn sm" id="leaveBtn">Leave</button>
  </div>
</header>

<section id="lobby">
  <h1>Watch something together</h1>
  <p class="lead">Make a room, send your friend the code, and pick a movie, show, or anime.</p>
  <div class="box">
    <div class="mode"><button class="on" data-mode="host">Create room</button><button data-mode="join">Join room</button></div>
    <div id="formHost">
      <label class="f" for="hostName">Your name</label>
      <input id="hostName" placeholder="Eni" maxlength="18">
      <button class="btn primary" id="createBtn">Create room</button>
    </div>
    <div id="formJoin" hidden>
      <label class="f" for="joinName">Your name</label>
      <input id="joinName" placeholder="Lo" maxlength="18">
      <label class="f" for="joinCode">Room code</label>
      <input id="joinCode" placeholder="ABC123" maxlength="6" autocapitalize="characters" autocomplete="off">
      <button class="btn primary" id="joinBtn">Join room</button>
    </div>
  </div>
</section>

<section id="room" hidden>
  <div class="layout">
    <div>
      <div class="stage"><div id="player-container" style="position:absolute;inset:0">
        <div class="empty"><strong>Nothing playing yet</strong>Search for a movie, show, or anime on the right.</div>
      </div></div>
      <div class="now" id="nowBar" hidden><span>Now playing: <b id="nowTitle"></b></span><button class="btn sm" id="nextSrv" title="Switch to the next server">Not loading? Next server</button></div>
    </div>

    <aside class="side">
      <div class="tabs">
        <button class="tab on" data-tab="browse">Browse</button>
        <button class="tab" data-tab="chat">Chat<span class="dot" id="chatBadge" hidden></span></button>
      </div>

      <div class="pane scroll" id="pane-browse">
        <div id="searchView">
          <div class="search">
            <input id="searchInput" placeholder="Search titles" spellcheck="false">
            <button class="btn primary" id="searchBtn">Search</button>
          </div>
          <div class="kind">
            <button class="chip on" data-kind="movie">Movies</button>
            <button class="chip" data-kind="series">TV shows</button>
            <button class="chip" data-kind="anime">Anime</button>
          </div>
          <div class="opts">
            <select id="serverSelect" aria-label="Server"></select>
            <label title="Some servers refuse to play with this on"><input type="checkbox" id="blockPop"> Block pop-ups</label>
          </div>
          <div id="animeOpts" class="subdub" hidden>
            <button class="sdbtn on" data-audio="sub">SUB</button>
            <button class="sdbtn" data-audio="dub">DUB</button>
          </div>
          <div id="searchResults"><div class="msgline">Search for something to watch.</div></div>
        </div>

        <div id="showView" hidden>
          <div class="back">
            <button class="btn sm" id="backBtn">← Back</button>
            <h3 id="showName"></h3>
          </div>
          <select id="seasonSelect" aria-label="Season"></select>
          <div id="episodes" style="margin-top:8px"></div>
        </div>
      </div>

      <div class="pane" id="pane-chat" hidden>
        <div class="chatlog" id="chatLog"></div>
        <div class="chatsend">
          <input id="chatInput" placeholder="Message" maxlength="300" autocomplete="off">
          <button class="btn primary" id="chatSend">Send</button>
        </div>
      </div>
    </aside>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = { ws:null, inRoom:false, role:null, code:'', name:'Guest', tab:'browse', kind:'movie', show:null, seasons:{}, audio:'sub', animeServers:[] };
const META = 'https://v3-cinemeta.strem.io';

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800); }
function genCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }

function addChat(who, text, mine){
  const log=$('#chatLog'), d=document.createElement('div');
  if (who==='system'){ d.className='msg sys'; d.textContent=text; }
  else { d.className='msg'; d.innerHTML=`<b>${esc(mine?'You':who)}</b>${esc(text)}`; if(!mine && S.tab!=='chat') $('#chatBadge').hidden=false; }
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}
function setStatus(t, live){ const p=$('#statusPill'); p.textContent=t; p.classList.toggle('live',!!live); }
const send = m => { if (S.ws && S.ws.readyState===1) S.ws.send(JSON.stringify(m)); };

/* ---------- Movie/TV servers ---------- */
const SERVERS = [
  { name: 'VidSrc (Fast)', m: i => `https://vidsrc.to/embed/movie/${i}`, t: (i,s,e) => `https://vidsrc.to/embed/tv/${i}/${s}/${e}` },
  { name: 'EmbedMaster', m: i => `https://embedmaster.link/movie/${i}`, t: (i,s,e) => `https://embedmaster.link/tv/${i}/${s}/${e}` },
  { name: 'VidLink', m: i => `https://vidlink.pro/movie/${i}`, t: (i,s,e) => `https://vidlink.pro/tv/${i}/${s}/${e}` },
  { name: 'VidFast', m: i => `https://vidfast.pro/movie/${i}`, t: (i,s,e) => `https://vidfast.pro/tv/${i}/${s}/${e}` },
  { name: '2Embed', m: i => `https://www.2embed.cc/embed/${i}`, t: (i,s,e) => `https://www.2embed.cc/embedtv/${i}&s=${s}&e=${e}` },
  { name: 'VidNest', m: i => `https://vidnest.fun/movie/${i}`, t: (i,s,e) => `https://vidnest.fun/tv/${i}/${s}/${e}` }
];

/* ---------- Anime servers (from your screenshots) ---------- */
const ANIME_SERVERS = [
  { name: 'MegaPlay', build: (id, ep, audio) => `https://megaplay.buzz/stream/ani/${id}/${ep}/${audio}` },
  { name: 'Miruro', build: (id, ep, audio) => `https://miruro.tv/watch/${id}?ep=${ep}` },
  { name: 'AnimeKai', build: (id, ep, audio) => `https://anikai.to/watch/${id}/episode-${ep}` },
  { name: 'Mkissa', build: (id, ep, audio) => `https://mkissa.to/anime/${id}/episode-${ep}` },
  { name: 'AnimeHeaven', build: (id, ep, audio) => `https://animeheaven.me/anime.php?${id}` },
  { name: 'AnimeVilla', build: (id, ep, audio) => `https://animevilla.org/anime/${id}/episode-${ep}` },
  { name: '2Embed Anime', build: (id, ep, audio) => `https://www.2embed.cc/embedanime/${id}&s=1&e=${ep}` }
];

/* ---------- search ---------- */
async function anilistSearch(q){
  const query = `query($s:String){Page(perPage:12){media(search:$s,type:ANIME,sort:SEARCH_MATCH){id idMal title{romaji english}coverImage{medium}startDate{year}}}}`;
  try {
    const r = await fetch('https://graphql.anilist.co', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({query, variables:{s:q}})
    });
    const j = await r.json();
    return (j.data?.Page?.media || []).map(a => ({
      anilistId: a.id, malId: a.idMal,
      name: a.title.english || a.title.romaji,
      poster: a.coverImage?.medium,
      releaseInfo: a.startDate?.year || ''
    }));
  } catch(e){ return []; }
}

async function imdbSearch(q){
  try {
    const c = q.trim().toLowerCase();
    const first = /^[a-z0-9]/.test(c) ? c[0] : 'x';
    const r = await fetch(`https://v3.sg.media-imdb.com/suggestion/${first}/${encodeURIComponent(c)}.json`);
    const j = await r.json();
    const types = S.kind === 'movie' ? ['movie','tvMovie'] : ['tvSeries','tvMiniSeries'];
    return (j.d||[]).filter(x => /^tt/.test(x.id) && types.includes(x.qid)).map(x => ({ imdb_id:x.id, name:x.l, releaseInfo:x.y, poster:x.i?.imageUrl }));
  } catch(e){ return []; }
}

async function doSearch(q){
  const box = $('#searchResults');
  box.innerHTML = '<div class="msgline">Searching…</div>';

  if (S.kind === 'anime'){
    const anime = await anilistSearch(q);
    if (!anime.length){ box.innerHTML = '<div class="msgline">No anime found for "'+esc(q)+'".</div>'; return; }
    box.innerHTML = '<div class="grid"></div>';
    const grid = box.firstChild;
    anime.forEach(a => {
      const b = document.createElement('button'); b.className = 'card';
      b.innerHTML = `<div class="img" style="${a.poster ? `background-image:url('${esc(a.poster)}')` : ''}"></div><div class="t">${esc(a.name)}</div><div class="y">${esc(a.releaseInfo)}</div>`;
      b.onclick = () => openAnime(a.anilistId, a.name);
      grid.appendChild(b);
    });
    return;
  }

  try {
    let metas = [];
    try { const r = await fetch(`${META}/catalog/${S.kind}/top/search=${encodeURIComponent(q)}.json`); const j = await r.json(); metas = j.metas || []; } catch(e){}
    if (!metas.length) metas = await imdbSearch(q);
    if (!metas.length){ box.innerHTML = '<div class="msgline">No results for "'+esc(q)+'".</div>'; return; }
    box.innerHTML = '<div class="grid"></div>';
    const grid = box.firstChild;
    metas.slice(0,18).forEach(m => {
      const id = m.imdb_id || m.id;
      const b = document.createElement('button'); b.className = 'card';
      b.innerHTML = `<div class="img" style="${m.poster ? `background-image:url('${esc(m.poster)}')` : ''}"></div><div class="t">${esc(m.name)}</div><div class="y">${esc(m.releaseInfo || m.year || '')}</div>`;
      b.onclick = () => {
        if (S.kind === 'movie') play('movie', id, 0, 0, m.name);
        else openShow(id, m.name);
      };
      grid.appendChild(b);
    });
  } catch(e){ box.innerHTML = '<div class="msgline">Search failed. Check your connection.</div>'; }
}

/* ---------- Play logic ---------- */
async function play(kind, id, s, e, name){
  S.last = { kind, id, s, e, name };
  if (kind === 'anime') return playAnime(id, s, name);
  
  const srv = SERVERS[+$('#serverSelect').value] || SERVERS[0];
  const url = kind === 'movie' ? srv.m(id) : srv.t(id, s, e);
  requestPlay(url, name);
}

function playAnime(anilistId, ep, name){
  const srv = ANIME_SERVERS[+$('#serverSelect').value] || ANIME_SERVERS[0];
  const url = srv.build(anilistId, ep, S.audio);
  requestPlay(url, name + ' (EP ' + ep + ' ' + S.audio.toUpperCase() + ')');
}

function requestPlay(url, name){
  if (S.role === 'host'){ loadPlayer(url, name); send({t:'player', url, name}); }
  else { send({t:'req-player', url, name}); toast('Asked the host to play ' + name); }
}

/* ---------- Anime episode list ---------- */
async function openAnime(anilistId, name){
  S.show = { anilistId, name };
  $('#searchView').hidden = true; $('#showView').hidden = false; $('#showName').textContent = name;
  $('#seasonSelect').hidden = true;
  $('#episodes').innerHTML = '<div class="msgline">Loading episodes…</div>';
  try {
    const r = await fetch('https://graphql.anilist.co', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ query: `query($id:Int){Media(id:$id,type:ANIME){episodes}}`, variables:{id:anilistId} })
    });
    const j = await r.json();
    const total = j.data?.Media?.episodes;
    if (!total){ $('#episodes').innerHTML = '<div class="msgline">No episode list found.</div>'; return; }
    const box = $('#episodes'); box.innerHTML = '';
    for (let i = 1; i <= total; i++){
      const b = document.createElement('button'); b.className = 'ep';
      b.innerHTML = `<span class="n">${i}</span><span class="tt">Episode ${i}</span>`;
      b.onclick = () => playAnime(anilistId, i, name);
      box.appendChild(b);
    }
  } catch(e){ $('#episodes').innerHTML = '<div class="msgline">Couldn\'t load episodes.</div>'; }
}

/* ---------- TV shows ---------- */
async function openShow(id, name){
  S.show = { id, name };
  $('#searchView').hidden = true; $('#showView').hidden = false; $('#showName').textContent = name;
  $('#seasonSelect').hidden = false;
  $('#seasonSelect').innerHTML = ''; $('#episodes').innerHTML = '<div class="msgline">Loading episodes…</div>';
  try {
    const r = await fetch(`${META}/meta/series/${id}.json`); const j = await r.json();
    const vids = ((j.meta || {}).videos || []).filter(v => v.season > 0);
    if (!vids.length){ $('#episodes').innerHTML = '<div class="msgline">No episode list found.</div>'; return; }
    S.seasons = {};
    vids.forEach(v => { (S.seasons[v.season] = S.seasons[v.season] || []).push(v); });
    const nums = Object.keys(S.seasons).map(Number).sort((a,b) => a-b);
    $('#seasonSelect').innerHTML = nums.map(n => `<option value="${n}">Season ${n}</option>`).join('');
    renderEpisodes(nums[0]);
  } catch(e){ $('#episodes').innerHTML = '<div class="msgline">Couldn\'t load episodes.</div>'; }
}

function renderEpisodes(season){
  const list = (S.seasons[season] || []).slice().sort((a,b) => (a.episode || a.number) - (b.episode || b.number));
  const box = $('#episodes'); box.innerHTML = '';
  list.forEach(v => {
    const ep = v.episode || v.number;
    const b = document.createElement('button'); b.className = 'ep';
    const date = v.released ? new Date(v.released).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) : '';
    b.innerHTML = `<span class="n">${ep}</span><span class="tt">${esc(v.name || v.title || ('Episode ' + ep))}${date ? `<small>${esc(date)}</small>` : ''}</span>`;
    b.onclick = () => play('series', S.show.id, season, ep, `${S.show.name} S${season}E${ep}`);
    box.appendChild(b);
  });
}

/* ---------- player ---------- */
function loadPlayer(url, name){
  const sandbox = $('#blockPop').checked ? ' sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"' : '';
  $('#player-container').innerHTML = `<iframe src="${esc(url)}"${sandbox} allowfullscreen allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>`;
  $('#nowTitle').textContent = name; $('#nowBar').hidden = false;
  addChat('system', 'Now playing: ' + name);
}

/* fullscreen → landscape */
function onFs(){
  const fs = document.fullscreenElement || document.webkitFullscreenElement, so = screen.orientation;
  if(!so) return;
  if(fs){ try{ so.lock('landscape').catch(()=>{}); }catch(e){} } else { try{ so.unlock(); }catch(e){} }
}
document.addEventListener('fullscreenchange', onFs);
document.addEventListener('webkitfullscreenchange', onFs);

/* ---------- connection ---------- */
function connect(onOpen){
  if (S.ws && S.ws.readyState <= 1) return;
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  S.ws = ws;
  ws.onopen = onOpen;
  ws.onmessage = ev => { let m; try{ m = JSON.parse(ev.data); }catch(e){ return; } onMessage(m); };
  ws.onclose = () => {
    if (S.ws !== ws) return;
    if (S.inRoom){ setStatus('Disconnected', false); addChat('system','Connection lost. Leave and rejoin.'); toast('Connection lost'); }
    else toast('Couldn\'t reach the server. Try again.');
    S.ws = null;
  };
}

function onMessage(m){
  switch(m.t){
    case 'created': S.code = m.code; enterRoom('host'); $('#codePill').textContent = m.code; setStatus('Online', true); addChat('system','Room ready.'); break;
    case 'joined':  S.code = m.code; enterRoom('guest'); $('#codePill').textContent = m.code; setStatus('Connected', true); addChat('system','Connected to room.'); if(m.now) loadPlayer(m.now.url, m.now.name); break;
    case 'error':   toast(m.msg); if(S.ws){ const w = S.ws; S.ws = null; w.close(); } break;
    case 'sys':     addChat('system', m.text); break;
    case 'chat':    addChat(m.from, m.text); break;
    case 'player':  loadPlayer(m.url, m.name); break;
    case 'req-player': if(S.role === 'host'){ loadPlayer(m.url, m.name); send({t:'player', url:m.url, name:m.name}); } break;
    case 'count':   setStatus(m.n + (m.n === 1 ? ' person' : ' people'), true); break;
    case 'closed':  S.inRoom = false; setStatus('Room closed', false); addChat('system','The host left.'); break;
  }
}

/* ---------- rooms ---------- */
function enterRoom(role){
  S.inRoom = true;
  $('#lobby').hidden = true; $('#room').hidden = false; $('#roomInfo').hidden = false;
  $('#rolePill').textContent = role === 'host' ? 'Host' : 'Guest';
}
function createRoom(){
  S.role = 'host'; S.name = $('#hostName').value.trim() || 'Host';
  connect(() => send({t:'create', name:S.name}));
}
function joinRoom(){
  const code = $('#joinCode').value.trim().toUpperCase();
  if(code.length < 4) return toast('Enter the room code');
  S.role = 'guest'; S.name = $('#joinName').value.trim() || 'Guest';
  connect(() => send({t:'join', name:S.name, code}));
}

/* ---------- wiring ---------- */
$('#searchBtn').onclick = () => { const q = $('#searchInput').value.trim(); if(q) doSearch(q); };
$('#searchInput').onkeydown = e => { if(e.key === 'Enter') $('#searchBtn').click(); };

document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  S.kind = c.dataset.kind;
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
  $('#searchInput').placeholder = S.kind === 'movie' ? 'Search movies' : S.kind === 'series' ? 'Search TV shows' : 'Search anime';
  $('#animeOpts').hidden = S.kind !== 'anime';

  // Swap the server dropdown based on kind
  const list = S.kind === 'anime' ? ANIME_SERVERS : SERVERS;
  $('#serverSelect').innerHTML = list.map((v,n)=>`<option value="${n}">${v.name}</option>`).join('');

  const q = $('#searchInput').value.trim(); if(q) doSearch(q);
  else $('#searchResults').innerHTML = '<div class="msgline">Search for something to watch.</div>';
});

document.querySelectorAll('.sdbtn').forEach(b => b.onclick = () => {
  S.audio = b.dataset.audio;
  document.querySelectorAll('.sdbtn').forEach(x => x.classList.toggle('on', x === b));
  toast('Anime audio: ' + S.audio.toUpperCase());
});

$('#nextSrv').onclick = () => {
  const sel = $('#serverSelect');
  const list = S.kind === 'anime' ? ANIME_SERVERS : SERVERS;
  sel.value = (+sel.value + 1) % list.length;
  toast('Trying ' + list[+sel.value].name);
  if (S.last) play(S.last.kind, S.last.id, S.last.s, S.last.e, S.last.name);
};

$('#backBtn').onclick = () => { $('#showView').hidden = true; $('#searchView').hidden = false; };
$('#seasonSelect').onchange = e => renderEpisodes(+e.target.value);

$('#createBtn').onclick = createRoom; $('#joinBtn').onclick = joinRoom;
$('#hostName').onkeydown = e => { if(e.key === 'Enter') createRoom(); };
$('#joinCode').onkeydown = e => { if(e.key === 'Enter') joinRoom(); };
$('#copyBtn').onclick = () => { try{ navigator.clipboard.writeText(S.code); toast('Code copied'); }catch(e){ toast('Code: ' + S.code); } };
$('#linkBtn').onclick = () => { const u = location.origin + location.pathname + '?room=' + S.code; try{ navigator.clipboard.writeText(u); toast('Invite link copied'); }catch(e){ toast(u); } };
$('#leaveBtn').onclick = () => { location.href = location.pathname; };

(function(){ const r = (new URLSearchParams(location.search).get('room') || '').toUpperCase().slice(0,6);
  if(r){ document.querySelector('.mode button[data-mode="join"]').click(); $('#joinCode').value = r; $('#joinName').focus(); } })();

document.querySelectorAll('.mode button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.mode button').forEach(x => x.classList.toggle('on', x === b));
  $('#formHost').hidden = b.dataset.mode !== 'host'; $('#formJoin').hidden = b.dataset.mode !== 'join';
});

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  S.tab = t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  $('#pane-browse').hidden = S.tab !== 'browse'; $('#pane-chat').hidden = S.tab !== 'chat';
  if(S.tab === 'chat'){ $('#chatBadge').hidden = true; const l = $('#chatLog'); l.scrollTop = l.scrollHeight; }
});

function sendChat(){
  const i = $('#chatInput'), text = i.value.trim(); if(!text) return; i.value = '';
  addChat(S.name, text, true); send({t:'chat', text});
}
$('#chatSend').onclick = sendChat; $('#chatInput').onkeydown = e => { if(e.key === 'Enter') sendChat(); };
})();
</script>
</body>
</html>
